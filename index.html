<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>PHOTO FINISH PRO — DOWNLOAD</title>
  <meta name="theme-color" content="#0b0e14">

  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-panel: #141923;
      --border-color: #222b3c;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --neon-green: #00ff66;
      --neon-red: #ff3366;
      --neon-yellow: #ffcc00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .header-logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .header-logo span {
      color: var(--neon-yellow);
      background: #222;
      padding: 2px 6px;
      border-radius: 3px;
      margin: 0 4px;
    }

    .header-badge {
      background: var(--neon-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .main-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      background: var(--bg-panel);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      background: var(--neon-green);
      color: #0b0e14;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      padding: 15px 40px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
    }

    .file-info {
      margin-top: 15px;
      font-size: 12px;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">PHOTO FINISH <span>PRO MAX</span></div>
    <div class="header-badge">OFFICIAL APP</div>
  </header>

  <div class="main-container">
    <h1>הורדת האפליקציה</h1>
    <p>לחץ על הכפתור למטה כדי להוריד את קובץ האפליקציה ישירות למכשיר שלך.</p>
    
    <!-- ודא שהקובץ שהעלית ל-GitHub נקרא בדיוק app-release.apk, או שנה את השם פה בהתאם -->
    <a href="Photo-finish-pro-2.apk" class="download-btn" download>הורד עכשיו (APK)</a>
    
    <div class="file-info">גרסה עדכנית | קובץ מאובטח</div>
  </div>

  <footer>
    © 2026 PHOTO FINISH PRO MAX
  </footer>

</body>
</html>
